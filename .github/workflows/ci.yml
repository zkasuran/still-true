name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to keep the queue clean.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: typecheck, build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --legacy-peer-deps mirrors local install: vitest 5 and @vitejs/plugin-react
      # declare vite as a peer, and React 19 predates some transitive peer ranges.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  e2e:
    name: playwright e2e (non-blocking)
    runs-on: ubuntu-latest
    # Optional gate: e2e builds and serves the app and reaches the public Sanity
    # dataset, so a network hiccup must not fail the pipeline. Kept off the
    # required path on purpose.
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e (webServer builds and starts the app)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
